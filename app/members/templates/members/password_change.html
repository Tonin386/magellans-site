{% extends "layouts/app.html" %}

{% block title %}Changer de mot de passe{% endblock %}

{% block content %}
<c-page-header title="Changer de mot de passe" back="{% url 'members:profile' %}" back_label="Mon profil" />
<form method="post" class="max-w-lg space-y-5" novalidate>
  {% csrf_token %}
  <c-card>
    <div class="space-y-5">
      <c-field :field="form.old_password" />
      <c-field :field="form.new_password1" />
      <c-field :field="form.new_password2" />
    </div>
  </c-card>
  <div class="flex justify-end"><button type="submit" class="btn btn-primary">Enregistrer</button></div>
</form>
{% endblock %}
