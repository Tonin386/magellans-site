{% extends "layouts/app.html" %}
{% block title %}Notes de frais{% endblock %}
{% block content %}
<c-page-header eyebrow="Trésorerie" title="Notes de frais" back="{% url 'backoffice:finance' %}" back_label="Trésorerie" />
<form class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center" hx-get="{{ request.path }}" hx-target="#table" hx-trigger="change" hx-push-url="true">
  {% include "backoffice/partials/search.html" with placeholder="Intitulé, auteur·ice, projet…" %}
  <select name="statut" class="select sm:w-72" aria-label="Statut">
    <option value="todo" {% if status == "todo" %}selected{% endif %}>À traiter (en cours)</option>
    <option value="all" {% if status == "all" %}selected{% endif %}>Toutes</option>
    {% for value, label in statuses %}<option value="{{ value }}" {% if value == status %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
</form>
<div id="table" class="card overflow-hidden">{% include "backoffice/finance/partials/invoices_table.html" %}</div>
{% endblock %}
