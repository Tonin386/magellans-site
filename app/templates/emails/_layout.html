{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f6f2ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;color:#1c1612;">
  <span style="display:none!important;opacity:0;color:transparent;height:0;width:0;overflow:hidden">{{ subject }}</span>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f2ec;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;">
        <tr><td style="padding:0 8px 18px;">
          <a href="{{ site_url }}" style="text-decoration:none;color:#1c1612;font-weight:800;font-size:20px;">
            <img src="{{ site_url }}{% static 'img/logo-512.png' %}" alt="" width="36" height="36" style="vertical-align:middle;margin-right:8px;border:0;">{{ site.site_name }}
          </a>
        </td></tr>
        <tr><td style="background:#ffffff;border-radius:20px;padding:32px 30px;border:1px solid #e4dcd2;font-size:15px;line-height:1.65;">
          <div class="content">{{ content }}</div>
        </td></tr>
        <tr><td style="padding:22px 8px;font-size:12px;line-height:1.6;color:#8a7d72;text-align:center;">
          {{ site.site_name }} — association loi 1901{% if site.city %} · {{ site.city }}{% endif %}<br>
          <a href="{{ site_url }}" style="color:#b96204;">{{ site_url|cut:"https://"|cut:"http://" }}</a> · <a href="mailto:{{ site.contact_email }}" style="color:#b96204;">{{ site.contact_email }}</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
