{% extends "layouts/auth.html" %}
{% block title %}Mot de passe oublié{% endblock %}
{% block auth_content %}
<h1 class="text-3xl font-extrabold">Mot de passe oublié ?</h1>
<p class="mt-2 text-muted">Indique ton adresse e-mail : nous t'envoyons un lien pour en choisir un nouveau.</p>
<form method="post" class="mt-8 space-y-5" novalidate>
  {% csrf_token %}
  <c-field :field="form.email" />
  <button type="submit" class="btn btn-primary btn-lg w-full">Recevoir le lien</button>
</form>
<p class="mt-8 text-center text-sm"><a href="{% url 'login' %}" class="link">Retour à la connexion</a></p>
{% endblock %}
