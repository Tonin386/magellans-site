<c-vars icon="sparkles" title="" class="" />
<div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-line-strong px-6 py-12 text-center {{ class }}">
  <span class="mb-4 grid size-12 place-items-center rounded-2xl bg-accent-soft text-2xl text-accent">{% icon icon %}</span>
  {% if title %}<p class="font-display text-lg font-bold">{{ title }}</p>{% endif %}
  <div class="mt-1 max-w-md text-sm text-muted">{{ slot }}</div>
  {% if actions %}<div class="mt-5 flex flex-wrap justify-center gap-2">{{ actions }}</div>{% endif %}
</div>
