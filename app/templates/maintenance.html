{% load static %}<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Maintenance · {{ site.site_name }}</title>
  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <style nonce="{{ csp_nonce }}">
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, rgba(255,171,14,.25), transparent 50%), #0b0907; color: #f4eee7; font: 17px/1.6 system-ui, sans-serif; text-align: center; padding: 1.5rem; }
    img { width: 96px; height: 96px; animation: spin 20s linear infinite; }
    h1 { font-size: clamp(2rem, 6vw, 3.25rem); margin: 1.5rem 0 .5rem; }
    p { color: #b0a396; max-width: 34rem; margin: 0 auto; }
    a { color: #ffb320; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { img { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img src="{% static 'img/logo.svg' %}" alt="">
    <h1>Nous revenons très vite !</h1>
    <p>{{ site.maintenance_message }}</p>
    {% if site.instagram_url %}<p style="margin-top:1rem"><a href="{{ site.instagram_url }}">Instagram</a>{% if site.contact_email %} · <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a>{% endif %}</p>{% endif %}
  </main>
</body>
</html>
